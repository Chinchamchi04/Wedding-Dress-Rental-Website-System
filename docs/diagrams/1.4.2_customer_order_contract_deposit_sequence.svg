<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 920" width="100%" height="100%" style="background:#ffffff; font-family: Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Solid Arrow Marker for Synchronous Calls -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <!-- Open Arrow Marker for Return Messages -->
    <marker id="open-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="45" y="42" font-size="20" font-weight="bold" fill="#155799" text-decoration="underline">1.4.2 Customer Create Rental Order, Sign Contract & Pay Deposit</text>

  <!-- LIFELINES (Dashed Lines) -->
  <line x1="110" y1="150" x2="110" y2="865" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5,5" />
  <line x1="310" y1="130" x2="310" y2="865" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5,5" />
  <line x1="500" y1="130" x2="500" y2="865" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5,5" />
  <line x1="690" y1="130" x2="690" y2="865" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5,5" />
  <line x1="900" y1="130" x2="900" y2="865" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5,5" />
  <line x1="1120" y1="130" x2="1120" y2="865" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5,5" />

  <!-- HEADERS -->
  <!-- Actor Customer -->
  <g transform="translate(92, 65)">
    <circle cx="18" cy="10" r="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
    <line x1="18" y1="20" x2="18" y2="40" stroke="#6c8ebf" stroke-width="1.5" />
    <line x1="6" y1="27" x2="30" y2="27" stroke="#6c8ebf" stroke-width="1.5" />
    <line x1="18" y1="40" x2="8" y2="58" stroke="#6c8ebf" stroke-width="1.5" />
    <line x1="18" y1="40" x2="28" y2="58" stroke="#6c8ebf" stroke-width="1.5" />
    <text x="18" y="74" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Customer</text>
  </g>

  <!-- <<user interface>> CheckoutPage -->
  <rect x="240" y="75" width="140" height="50" rx="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
  <text x="310" y="94" font-size="11" fill="#333333" text-anchor="middle">&lt;&lt;user interface&gt;&gt;</text>
  <text x="310" y="112" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">CheckoutPage</text>

  <!-- <<route>> orderRoutes -->
  <rect x="435" y="75" width="130" height="50" rx="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
  <text x="500" y="94" font-size="11" fill="#333333" text-anchor="middle">&lt;&lt;route&gt;&gt;</text>
  <text x="500" y="112" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">orderRoutes</text>

  <!-- <<control>> orderController -->
  <rect x="620" y="75" width="140" height="50" rx="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
  <text x="690" y="94" font-size="11" fill="#333333" text-anchor="middle">&lt;&lt;control&gt;&gt;</text>
  <text x="690" y="112" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">orderController</text>

  <!-- <<service>> orderService -->
  <rect x="830" y="75" width="140" height="50" rx="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
  <text x="900" y="94" font-size="11" fill="#333333" text-anchor="middle">&lt;&lt;service&gt;&gt;</text>
  <text x="900" y="112" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">orderService</text>

  <!-- <<database>> OrderModel(MongoDB) -->
  <rect x="1040" y="75" width="160" height="50" rx="0" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
  <text x="1120" y="94" font-size="11" fill="#333333" text-anchor="middle">&lt;&lt;database&gt;&gt;</text>
  <text x="1120" y="112" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">OrderModel(MongoDB)</text>

  <!-- ACTIVATION BARS -->
  <!-- Customer -->
  <rect x="104" y="160" width="12" height="680" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />
  <!-- UI -->
  <rect x="304" y="160" width="12" height="680" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />
  <!-- Route -->
  <rect x="494" y="285" width="12" height="45" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />
  <!-- Controller -->
  <rect x="684" y="315" width="12" height="440" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />
  <!-- Service -->
  <rect x="894" y="345" width="12" height="380" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />
  <!-- Database -->
  <rect x="1114" y="645" width="12" height="50" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />

  <!-- MESSAGES BEFORE ALT -->
  <!-- 1.1 -->
  <line x1="116" y1="175" x2="304" y2="175" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="210" y="169" font-size="11" fill="#000000" text-anchor="middle">1.1: Select rental dates, days, delivery method & fill measurements</text>

  <!-- 1.2 -->
  <line x1="116" y1="215" x2="304" y2="215" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="210" y="209" font-size="11" fill="#000000" text-anchor="middle">1.2: Review rental contract terms & submit electronic signature</text>

  <!-- 1.3 -->
  <line x1="116" y1="255" x2="304" y2="255" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="210" y="249" font-size="11" fill="#000000" text-anchor="middle">1.3: Select deposit option (50%/100%), scan VietQR & click 'Confirm Deposit'</text>

  <!-- 1.4 -->
  <line x1="316" y1="290" x2="494" y2="290" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="405" y="284" font-size="11" fill="#000000" text-anchor="middle">1.4: POST /api/orders (body: orderPayload)</text>

  <!-- 1.5 -->
  <line x1="506" y1="320" x2="684" y2="320" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="595" y="314" font-size="11" fill="#000000" text-anchor="middle">1.5: createOrder(req, res, next)</text>

  <!-- 1.6 -->
  <line x1="696" y1="350" x2="894" y2="350" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="795" y="344" font-size="11" fill="#000000" text-anchor="middle">1.6: createOrder(req.body, req.user)</text>

  <!-- 1.7 (Self-call loop) -->
  <path d="M 906 380 L 938 380 L 938 405 L 906 405" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="944" y="396" font-size="11" fill="#000000" text-anchor="start">1.7: Validate input: items, rentalDates, customerContact, contractSignature</text>

  <!-- ALT FRAME -->
  <rect x="50" y="425" width="1170" height="415" fill="none" stroke="#000000" stroke-width="1.2" />
  <!-- alt tab -->
  <path d="M 50 425 L 110 425 L 110 445 L 100 455 L 50 455 Z" fill="#f0f0f0" stroke="#000000" stroke-width="1.2" />
  <text x="75" y="445" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">alt</text>

  <!-- Scenario 1 Guard -->
  <text x="65" y="475" font-size="11" font-weight="bold" fill="#333333">[Scenario 1: Validation Failed / Missing Info / Empty Items]</text>

  <!-- 1.8 (Error throw) -->
  <line x1="894" y1="490" x2="696" y2="490" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="795" y="484" font-size="11" fill="#cc0000" text-anchor="middle">1.8: throw Error("Rental order requires at least 1 dress item / Missing info...")</text>

  <!-- 1.9 -->
  <line x1="684" y1="520" x2="316" y2="520" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="500" y="514" font-size="11" fill="#000000" text-anchor="middle">1.9: HTTP 400 Bad Request { success: false, message }</text>

  <!-- 1.10 -->
  <line x1="304" y1="548" x2="116" y2="548" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="210" y="542" font-size="11" fill="#000000" text-anchor="middle">1.10: Display error notification toast on UI & scroll to missing step</text>

  <!-- ALT DIVIDER LINE -->
  <line x1="50" y1="568" x2="1220" y2="568" stroke="#666666" stroke-width="1.2" stroke-dasharray="6,4" />

  <!-- Scenario 2 Guard -->
  <text x="65" y="588" font-size="11" font-weight="bold" fill="#333333">[Scenario 2: Validation Passed / Success]</text>

  <!-- 1.11 (Self-call loop) -->
  <path d="M 906 605 L 938 605 L 938 630 L 906 630" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="944" y="621" font-size="11" fill="#000000" text-anchor="start">1.11: Calculate fees (totalRent, totalDeposit, depositPaid) & generate code: UB-2026-XXX, HĐ-UB-2026-XXX</text>

  <!-- 1.12 -->
  <line x1="906" y1="655" x2="1114" y2="655" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="1010" y="649" font-size="11" fill="#000000" text-anchor="middle">1.12: OrderModel.create(orderDoc)</text>

  <!-- 1.13 -->
  <line x1="1114" y1="685" x2="906" y2="685" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="1010" y="679" font-size="11" fill="#000000" text-anchor="middle">1.13: Return savedOrderDoc (status: 'deposit_paid')</text>

  <!-- 1.14 -->
  <line x1="894" y1="715" x2="696" y2="715" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="795" y="709" font-size="11" fill="#000000" text-anchor="middle">1.14: Return newOrder</text>

  <!-- 1.15 -->
  <line x1="684" y1="745" x2="316" y2="745" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="500" y="739" font-size="11" fill="#000000" text-anchor="middle">1.15: HTTP 201 Created { success: true, message: 'Order created successfully!', data: order }</text>

  <!-- 1.16 -->
  <line x1="304" y1="780" x2="116" y2="780" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="210" y="774" font-size="11" fill="#000000" text-anchor="middle">1.16: Show Success Modal, clear cart & redirect to Order Detail (/orders/:id)</text>

  <!-- 1.17 -->
  <line x1="304" y1="815" x2="116" y2="815" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="210" y="809" font-size="11" fill="#000000" text-anchor="middle">1.17: Send confirmation email & attached electronic rental contract</text>

</svg>