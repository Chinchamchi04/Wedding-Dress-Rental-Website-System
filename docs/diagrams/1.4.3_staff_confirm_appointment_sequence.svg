<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 920" width="100%" height="100%" style="background:#ffffff; font-family: Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.5" />
    </marker>
  </defs>

  <text x="45" y="42" font-size="20" font-weight="bold" fill="#155799" text-decoration="underline">1.4.3 Staff Receive & Confirm Dress Trial Appointment</text>

  <!-- LIFELINES -->
  <line x1="110" y1="150" x2="110" y2="865" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5,5" />
  <line x1="310" y1="130" x2="310" y2="865" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5,5" />
  <line x1="500" y1="130" x2="500" y2="865" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5,5" />
  <line x1="690" y1="130" x2="690" y2="865" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5,5" />
  <line x1="900" y1="130" x2="900" y2="865" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5,5" />
  <line x1="1120" y1="130" x2="1120" y2="865" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="5,5" />

  <!-- HEADERS -->
  <g transform="translate(92, 65)">
    <circle cx="18" cy="10" r="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
    <line x1="18" y1="20" x2="18" y2="40" stroke="#6c8ebf" stroke-width="1.5" />
    <line x1="6" y1="27" x2="30" y2="27" stroke="#6c8ebf" stroke-width="1.5" />
    <line x1="18" y1="40" x2="8" y2="58" stroke="#6c8ebf" stroke-width="1.5" />
    <line x1="18" y1="40" x2="28" y2="58" stroke="#6c8ebf" stroke-width="1.5" />
    <text x="18" y="74" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Staff</text>
  </g>

  <rect x="230" y="75" width="160" height="50" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
  <text x="310" y="94" font-size="11" fill="#333333" text-anchor="middle">&lt;&lt;user interface&gt;&gt;</text>
  <text x="310" y="112" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">AppointmentManagement</text>

  <rect x="425" y="75" width="150" height="50" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
  <text x="500" y="94" font-size="11" fill="#333333" text-anchor="middle">&lt;&lt;route&gt;&gt;</text>
  <text x="500" y="112" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">appointmentRoutes</text>

  <rect x="610" y="75" width="160" height="50" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
  <text x="690" y="94" font-size="11" fill="#333333" text-anchor="middle">&lt;&lt;control&gt;&gt;</text>
  <text x="690" y="112" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">appointmentController</text>

  <rect x="820" y="75" width="160" height="50" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
  <text x="900" y="94" font-size="11" fill="#333333" text-anchor="middle">&lt;&lt;service&gt;&gt;</text>
  <text x="900" y="112" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">appointmentService</text>

  <rect x="1025" y="75" width="190" height="50" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2" />
  <text x="1120" y="94" font-size="11" fill="#333333" text-anchor="middle">&lt;&lt;database&gt;&gt;</text>
  <text x="1120" y="112" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">AppointmentModel(MongoDB)</text>

  <!-- ACTIVATION BARS -->
  <rect x="104" y="160" width="12" height="680" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />
  <rect x="304" y="160" width="12" height="680" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />
  <rect x="494" y="245" width="12" height="50" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />
  <rect x="684" y="275" width="12" height="490" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />
  <rect x="894" y="305" width="12" height="430" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />
  <rect x="1114" y="340" width="12" height="45" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />
  <rect x="1114" y="625" width="12" height="50" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1" />

  <!-- MESSAGES -->
  <!-- 1.1 -->
  <line x1="116" y1="175" x2="304" y2="175" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="210" y="169" font-size="11" fill="#000000" text-anchor="middle">1.1: View pending appointments list (filtered by showroom branch)</text>

  <!-- 1.2 -->
  <line x1="116" y1="215" x2="304" y2="215" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="210" y="209" font-size="11" fill="#000000" text-anchor="middle">1.2: Check trial suite availability & click 'Xác nhận lịch' (Confirm)</text>

  <!-- 1.3 -->
  <line x1="316" y1="250" x2="494" y2="250" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="405" y="244" font-size="11" fill="#000000" text-anchor="middle">1.3: PATCH /api/appointments/:id/status (body: { status: 'confirmed' })</text>

  <!-- 1.4 -->
  <line x1="506" y1="280" x2="684" y2="280" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="595" y="274" font-size="11" fill="#000000" text-anchor="middle">1.4: updateAppointmentStatus(req, res, next)</text>

  <!-- 1.5 -->
  <line x1="696" y1="310" x2="894" y2="310" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="795" y="304" font-size="11" fill="#000000" text-anchor="middle">1.5: updateAppointmentStatus(id, status, staffId)</text>

  <!-- 1.6 -->
  <line x1="906" y1="345" x2="1114" y2="345" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="1010" y="339" font-size="11" fill="#000000" text-anchor="middle">1.6: AppointmentModel.findById(id)</text>

  <!-- ALT FRAME -->
  <rect x="50" y="380" width="1170" height="465" fill="none" stroke="#000000" stroke-width="1.2" />
  <path d="M 50 380 L 110 380 L 110 400 L 100 410 L 50 410 Z" fill="#f0f0f0" stroke="#000000" stroke-width="1.2" />
  <text x="75" y="400" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">alt</text>

  <!-- Scenario 1 Guard -->
  <text x="65" y="425" font-size="11" font-weight="bold" fill="#333333">[Scenario 1: Appointment Not Found / Invalid ID]</text>

  <!-- 1.7 -->
  <line x1="1114" y1="440" x2="906" y2="440" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="1010" y="434" font-size="11" fill="#000000" text-anchor="middle">1.7: return null</text>

  <!-- 1.8 -->
  <line x1="894" y1="465" x2="696" y2="465" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="795" y="459" font-size="11" fill="#cc0000" text-anchor="middle">1.8: throw Error("Không tìm thấy lịch hẹn.")</text>

  <!-- 1.9 -->
  <line x1="684" y1="495" x2="316" y2="495" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="500" y="489" font-size="11" fill="#000000" text-anchor="middle">1.9: HTTP 400 / 404 Bad Request { success: false, message }</text>

  <!-- 1.10 -->
  <line x1="304" y1="525" x2="116" y2="525" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="210" y="519" font-size="11" fill="#000000" text-anchor="middle">1.10: Display error notification toast: "Cập nhật trạng thái thất bại"</text>

  <!-- ALT DIVIDER LINE -->
  <line x1="50" y1="548" x2="1220" y2="548" stroke="#666666" stroke-width="1.2" stroke-dasharray="6,4" />

  <!-- Scenario 2 Guard -->
  <text x="65" y="568" font-size="11" font-weight="bold" fill="#333333">[Scenario 2: Appointment Found & Successfully Confirmed]</text>

  <!-- 1.11 -->
  <line x1="1114" y1="585" x2="906" y2="585" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="1010" y="579" font-size="11" fill="#000000" text-anchor="middle">1.11: return appointmentDoc</text>

  <!-- 1.12 -->
  <path d="M 906 600 L 938 600 L 938 623 L 906 623" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="944" y="615" font-size="11" fill="#000000" text-anchor="start">1.12: Update appointment.status = 'confirmed', assign staffId</text>

  <!-- 1.13 -->
  <line x1="906" y1="640" x2="1114" y2="640" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="1010" y="634" font-size="11" fill="#000000" text-anchor="middle">1.13: appointment.save()</text>

  <!-- 1.14 -->
  <line x1="1114" y1="670" x2="906" y2="670" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="1010" y="664" font-size="11" fill="#000000" text-anchor="middle">1.14: return updatedAppointment (status: 'confirmed')</text>

  <!-- 1.15 -->
  <line x1="894" y1="700" x2="696" y2="700" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="795" y="694" font-size="11" fill="#000000" text-anchor="middle">1.15: return appointment</text>

  <!-- 1.16 -->
  <line x1="684" y1="730" x2="316" y2="730" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="500" y="724" font-size="11" fill="#000000" text-anchor="middle">1.16: HTTP 200 OK { success: true, message: 'Cập nhật thành công!', data }</text>

  <!-- 1.17 -->
  <line x1="304" y1="765" x2="116" y2="765" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="210" y="759" font-size="11" fill="#000000" text-anchor="middle">1.17: Show toast "Đã xác nhận", re-fetch & update status badge to Confirmed</text>

  <!-- 1.18 -->
  <line x1="304" y1="800" x2="116" y2="800" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)" />
  <text x="210" y="794" font-size="11" fill="#000000" text-anchor="middle">1.18: Send confirmation SMS / Email to Customer with trial room details</text>
</svg>